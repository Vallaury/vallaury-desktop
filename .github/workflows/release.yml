name: Release

# A tag like v0.1.0 builds every package, writes the checksums and publishes a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - run: npm ci
      - run: npm test
      - run: npm run dist:linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: |
            out/*.AppImage
            out/*.deb
            out/*.rpm
            out/latest-linux*.yml
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Unsigned without a certificate. With WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD
      # set as repository secrets, electron-builder signs the installer by itself.
      - name: Signing identity (only when the secrets exist)
        shell: bash
        env:
          LINK: ${{ secrets.WIN_CSC_LINK }}
          PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          # An empty variable is not the same as an absent one for electron-builder, so nothing is exported without a certificate.
          if [ -n "$LINK" ]; then
            echo "WIN_CSC_LINK=$LINK" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          fi
      - run: npm run dist:win
      # Electron 44 no longer builds for 32-bit Windows; Electron 43 (still supported) does. Installer only, no update feed.
      - run: npm run dist:win32
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: |
            out/*.exe
            out/*.exe.blockmap
            out/latest.yml
            out/latest-arm64.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-ia32
          path: out32/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Unsigned without a Developer ID certificate. With CSC_LINK, CSC_KEY_PASSWORD and the
      # APPLE_* secrets set, the app is signed and notarized.
      - name: Signing identity (only when the secrets exist)
        env:
          LINK: ${{ secrets.CSC_LINK }}
          PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # An empty variable is not the same as an absent one for electron-builder, so nothing is exported without a certificate.
          if [ -n "$LINK" ]; then
            echo "CSC_LINK=$LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
            if [ -n "$API_KEY" ]; then
              echo "APPLE_API_KEY=$API_KEY" >> "$GITHUB_ENV"
              echo "APPLE_API_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
              echo "APPLE_API_ISSUER=$API_ISSUER" >> "$GITHUB_ENV"
            fi
          fi
      - run: npm run dist:mac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: |
            out/*.dmg
            out/*.dmg.blockmap
            out/*.zip
            out/*.zip.blockmap
            out/latest-mac.yml
          if-no-files-found: error

  snap:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # snapcraft builds for the architecture of the runner it runs on.
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
      # Goes to the Snap Store only when the store login exists (repository secret SNAPCRAFT_STORE_CREDENTIALS).
      # It lands in "candidate": promote it to "stable" by hand after trying it (snapcraft release vallaury <revision> stable).
      - name: Store login present?
        id: store
        env:
          CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: '[ -n "$CREDENTIALS" ] && echo "on=true" >> "$GITHUB_OUTPUT" || echo "on=false" >> "$GITHUB_OUTPUT"'
      - if: steps.store.outputs.on == 'true'
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: candidate

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      # Copies without the version in the name, so that releases/latest/download/<name> is a link that never goes stale.
      # The updater keeps using the versioned files (latest*.yml names them).
      - name: Stable names
        working-directory: release
        run: |
          for f in Vallaury-*; do
            case "$f" in *.blockmap) continue ;; esac
            stable=$(echo "$f" | sed -E 's/^Vallaury-[0-9]+\.[0-9]+\.[0-9]+-/Vallaury-/')
            cp "$f" "$stable"
          done
          ls
      - name: Checksums
        working-directory: release
        run: sha256sum Vallaury-* | tee SHA256SUMS
      # GitHub offers build provenance statements only for public repositories (or paid plans).
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/Vallaury-*
      # The text of the release is the install guide (.github/release-notes.md) plus the CHANGELOG section of the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node source/scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Vallaury $GITHUB_REF_NAME" --notes-file notes.md
