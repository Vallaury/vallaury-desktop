name: Bug in the desktop app
description: Something in the app (not the website) does not work
body:
  - type: input
    id: system
    attributes:
      label: System and version
      placeholder: Windows 11 24H2, macOS 15.2 (Apple silicon), Fedora 44 GNOME on Wayland
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: In the Help menu, About Vallaury.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: How did you install it?
      options: [AppImage, deb, rpm, Windows installer, macOS dmg, Built from source, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
